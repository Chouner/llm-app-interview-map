<title>AI 应用面试知识图谱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* 布局：左侧可折叠的思维导图（根 → 模块 → 知识点主线），右侧是选中节点的说明、链路和深度；窄屏上下堆叠 */
:root {
  --bg: #FFFFFF; --ink: #16181D; --muted: #575D69; --faint: #9A9EA6;
  --rule: #E3E1DC; --rule-strong: #16181D; --panel: #F7F6F3;
  --accent: #B8371B; --accent-soft: #F6E4DF; --line: #C9C6BF;
  --font-display: 'Noto Serif SC', 'Songti SC', serif;
  --font-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15171B; --ink: #ECEAE6; --muted: #A3A7AF; --faint: #6E737C;
  --rule: #2C2F35; --rule-strong: #ECEAE6; --panel: #1C1F24;
  --accent: #E0664A; --accent-soft: #3A231D; --line: #3E424A; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15171B; --ink: #ECEAE6; --muted: #A3A7AF; --faint: #6E737C;
  --rule: #2C2F35; --rule-strong: #ECEAE6; --panel: #1C1F24;
  --accent: #E0664A; --accent-soft: #3A231D; --line: #3E424A; color-scheme: dark; }

body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.7; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { border-bottom: 1px solid var(--rule-strong); padding-block: 20px 16px; display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: flex-end; justify-content: space-between; }
header.top h1 { margin: 0; font-family: var(--font-display); font-size: 24px; line-height: 1.3; text-wrap: balance; }
.stats { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.search { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 240px; position: relative; }
.search label { font-size: 12px; color: var(--muted); }
.search input { height: 38px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
.results { position: absolute; top: 64px; left: 0; right: 0; z-index: 5; background: var(--bg); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 0; max-height: 320px; overflow: auto; }
.results button { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: none; border: 0; padding: 7px 12px; cursor: pointer; }
.results button:hover { background: var(--panel); }
.results .m { color: var(--muted); font-size: 12px; white-space: nowrap; }
.results .empty { padding: 7px 12px; color: var(--muted); font-size: 13px; }
.btn { height: 38px; padding: 0 14px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--rule-strong); }

.layout { display: flex; flex-wrap: wrap; align-items: stretch; }
main.map { flex: 999 1 560px; min-width: 0; padding-block: 16px 24px; padding-right: 24px; display: flex; flex-direction: column; gap: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.scroll { overflow: auto; max-height: 76vh; }
.scroll svg { display: block; }
.status { color: var(--muted); padding: 40px 0; }

svg .edge { fill: none; stroke: var(--line); stroke-width: 1.3; }
svg .edge.path { stroke: var(--accent); stroke-width: 2; }
svg .nd { cursor: pointer; }
@media (prefers-reduced-motion: no-preference) { svg .nd, svg .edge { transition: transform .25s ease, d .25s ease, opacity .2s; } }
svg .nd .hit { fill: transparent; }
svg .nd .hl { fill: none; }
svg .nd.sel .hl { fill: var(--accent-soft); }
svg .nd text { fill: var(--ink); font-family: var(--font-body); font-size: 13.5px; }
svg .nd.mod text { font-family: var(--font-display); font-size: 15.5px; font-weight: 700; }
svg .nd.root text { font-family: var(--font-display); font-size: 18px; font-weight: 700; }
svg .nd.grp text { font-size: 14px; font-weight: 700; fill: var(--muted); }
svg .nd.grp.sel text.lb { fill: var(--accent); }
svg .nd.sel text.lb { fill: var(--accent); font-weight: 700; }
svg .nd .dot { fill: var(--bg); stroke: var(--ink); stroke-width: 1.4; }
svg .nd .dot.iv { fill: var(--accent); stroke: var(--accent); }
svg .nd .tg { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
svg .nd .tg-t { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
svg .nd:hover text.lb { fill: var(--accent); }

aside.detail { flex: 1 1 320px; max-width: 420px; min-width: 0; padding-block: 20px 36px; padding-left: 28px; border-left: 1px solid var(--rule); display: flex; flex-direction: column; gap: 18px; }
.meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.chip { font-size: 11.5px; padding: 1px 8px; border: 1px solid var(--rule); border-radius: 10px; color: var(--muted); }
.chip.iv { border-color: var(--accent); color: var(--accent); }
.detail h2 { margin: 0; font-family: var(--font-display); font-size: 26px; line-height: 1.35; text-wrap: balance; }
.detail p { margin: 0; max-width: 36em; }
.detail .role { color: var(--muted); }
.detail section { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--rule); }
.detail h3 { margin: 0; font-size: 13px; font-weight: 700; }
.detail ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.todo { color: var(--muted); font-size: 13px; }
.step .kind { font-size: 11.5px; color: var(--faint); margin-right: 6px; }
.rel { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; background: var(--panel); border-radius: 6px; }
.rel .rh { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; font-size: 13.5px; }
.rel .rh .dir { font-weight: 400; font-size: 12px; color: var(--muted); white-space: nowrap; }
.rel .rd { font-size: 13px; color: var(--muted); }
.rel .pair { display: flex; flex-direction: column; gap: 1px; padding-top: 6px; border-top: 1px solid var(--rule); }
.rel .pair button { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font-size: 13.5px; }
.rel .pair button:hover { color: var(--accent); }
.rel .pair .loc { font-size: 11.5px; color: var(--faint); }
.rel .pair .why { font-size: 12.5px; color: var(--muted); }
.rels { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; align-items: start; }
.relpanel { border-top: 1px solid var(--rule-strong); padding-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.relpanel h2 { margin: 0; font-family: var(--font-display); font-size: 18px; text-wrap: balance; }
.relpanel .note { margin: 0; color: var(--muted); font-size: 13px; }

.chain { display: flex; flex-direction: column; }
.step { display: grid; grid-template-columns: 18px 1fr; column-gap: 12px; }
.step .rail { position: relative; }
.step .rail::before { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 1.5px; background: var(--line); }
.step:first-child .rail::before { top: 12px; }
.step:last-child .rail::before { bottom: calc(100% - 12px); }
.step .rail span { position: absolute; left: 3px; top: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--ink); box-sizing: border-box; }
.step.cur .rail span { background: var(--accent); border-color: var(--accent); }
.step.next .rail span { border-style: dashed; }
.step .body { padding-bottom: 12px; min-width: 0; }
.step .nm { background: none; border: 0; padding: 0; cursor: pointer; font-weight: 500; text-align: left; }
.step .nm:hover { color: var(--accent); }
.step.cur .nm { color: var(--accent); font-weight: 700; cursor: default; }
.step .why { font-size: 13px; color: var(--muted); }
.step .lbl { font-size: 11.5px; color: var(--faint); }

.depth { display: flex; flex-direction: column; gap: 10px; }
.lv { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: baseline; }
.lv b { font-size: 12.5px; }
.lv .bar { display: inline-flex; gap: 3px; margin-left: 4px; vertical-align: middle; }
.lv .bar i { width: 6px; height: 6px; border-radius: 1px; background: var(--line); }
.lv .bar i.on { background: var(--accent); }

.others { display: flex; flex-direction: column; gap: 8px; }
.other { display: flex; flex-direction: column; gap: 2px; }
.other button { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; display: flex; gap: 10px; justify-content: space-between; }
.other button:hover .n { color: var(--accent); }
.other .t { font-size: 12px; color: var(--muted); white-space: nowrap; }
.other .why { font-size: 13px; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 2px; }
.list button { background: none; border: 0; padding: 4px 0; text-align: left; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.list button:hover span:first-child { color: var(--accent); }
.list .t { font-size: 12px; color: var(--muted); }

@media (max-width: 900px) {
  main.map { padding-right: 0; }
  .scroll { max-height: 60vh; }
  aside.detail { max-width: none; flex-basis: 100%; border-left: 0; border-top: 1px solid var(--rule-strong); padding-left: 0; }
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>AI 应用开发面试知识图谱</h1>
      <div class="stats" id="stats">正在载入…</div>
    </div>
    <div class="tools">
      <div class="search">
        <label for="q">搜索知识点</label>
        <input id="q" type="search" placeholder="如：语义层、重排序、抽样" autocomplete="off">
        <div class="results" id="results" hidden></div>
      </div>
      <button class="btn" id="collapse" type="button">全部收起</button>
    </div>
  </header>

  <div class="layout">
    <main class="map">
      <div class="legend">
        <span>点击节点展开或收起</span>
        <span><i style="background:var(--accent)"></i>真实面试问到</span>
        <span><i style="border:1.4px solid var(--ink);box-sizing:border-box"></i>其他知识点</span>
      </div>
      <div class="scroll" id="scroll"><div class="status" id="status">正在载入图谱数据…</div></div>
      <section class="relpanel" aria-live="polite">
        <h2 id="relTitle">模块之间的关系</h2>
        <div id="relBody"></div>
      </section>
    </main>
    <aside class="detail" id="detail" aria-live="polite"></aside>
  </div>
</div>

<script>
(function () {
  const SRC = { jd: 'JD 要求', iv: '面试问到', co: '课程覆盖' };
  const LV = ['入门', '熟练', '深入'];
  const COL = 200, ROWH = 30, LINEH = 18, LEFT = 20, TOP = 18;
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);
  const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  let G, byId, mods, grps, tree, open = new Set(['root']), sel = 'root';
  const parentOf = {}, primaryOf = {};

  const units = (s) => [...s].reduce((a, c) => a + (/[\u0000-ÿ]/.test(c) ? 0.56 : 1), 0);
  function wrap(text, max) {
    if (units(text) <= max) return [text];
    const out = []; let cur = '';
    for (const ch of text) { if (units(cur + ch) > max && cur) { out.push(cur); cur = ''; } cur += ch; }
    if (cur) out.push(cur);
    return out.map((s) => s.trim());
  }

  function build(g) {
    G = g; byId = {}; mods = {}; grps = {};
    tree = { root: { id: 'root', kind: 'root', name: 'AI 应用开发', kids: [] } };
    g.modules.forEach((m) => {
      mods[m.id] = m;
      tree[m.id] = { id: m.id, kind: 'mod', name: m.name, kids: [] }; tree.root.kids.push(m.id); parentOf[m.id] = 'root';
      (m.groups || []).forEach((gr) => { grps[gr.id] = Object.assign({ m: m.id }, gr); tree[gr.id] = { id: gr.id, kind: 'grp', name: gr.name, kids: [] }; tree[m.id].kids.push(gr.id); parentOf[gr.id] = m.id; });
    });
    g.nodes.forEach((n) => { byId[n.id] = n; tree[n.id] = { id: n.id, kind: 'kp', name: n.name, kids: [], n }; });
    g.nodes.forEach((n) => {
      const same = n.pre.filter(([p]) => byId[p].m === n.m);
      const pick = same.find(([, s]) => s === 'h') || same[0];
      primaryOf[n.id] = pick ? pick[0] : null;
      const sameGroup = pick && (!n.g || byId[pick[0]].g === n.g);
      const par = sameGroup ? pick[0] : (n.g || n.m);
      parentOf[n.id] = par; tree[par].kids.push(n.id);
    });
  }

  const nameOf = (id) => (byId[id] || tree[id]).name;
  const loc = (id) => { const n = byId[id]; return mods[n.m].name + (n.g ? ' · ' + grps[n.g].name : ''); };
  const dependents = (id) => G.nodes.filter((n) => n.pre.some(([p]) => p === id));
  const pathTo = (id) => { const p = []; let c = id; while (c) { p.unshift(c); c = parentOf[c]; } return p; };
  const countIn = (id) => tree[id].kids.reduce((a, k) => a + (tree[k].kind === 'kp' ? 1 : 0) + countIn(k), 0);
  const linkText = (a, b) => (mods[a].links && mods[a].links[b]) || (mods[b].links && mods[b].links[a]) || '';

  // ---------- 导图 ----------
  function layout() {
    const pos = {}; let y = TOP;
    const walk = (id, depth) => {
      const t = tree[id];
      const lines = t.kind === 'kp' ? wrap(t.name, 11) : [t.name];
      if (!(open.has(id) && t.kids.length)) {
        const hgt = ROWH + (lines.length - 1) * LINEH;
        pos[id] = { x: LEFT + depth * COL, y: y + hgt / 2, lines }; y += hgt;
      } else {
        const ys = t.kids.map((k) => walk(k, depth + 1));
        pos[id] = { x: LEFT + depth * COL, y: (ys[0] + ys[ys.length - 1]) / 2, lines };
      }
      return pos[id].y;
    };
    walk('root', 0);
    return { pos, height: y + TOP };
  }
  const fontPx = (t) => (t.kind === 'root' ? 18 : t.kind === 'mod' ? 15.5 : t.kind === 'grp' ? 14 : 13.5);
  const labelWidth = (t, lines) => Math.max(...lines.map(units)) * fontPx(t);

  function render(scrollToSel) {
    const { pos, height } = layout();
    const ids = Object.keys(pos);
    const width = Math.max(400, Math.max(...ids.map((id) => pos[id].x + labelWidth(tree[id], pos[id].lines) + 70)) + LEFT);
    const onPath = new Set(pathTo(sel));
    const scroll = $('scroll'); const keepL = scroll.scrollLeft, keepT = scroll.scrollTop;
    scroll.textContent = '';
    const svg = svgEl('svg', { width, height, viewBox: `0 0 ${width} ${height}`, role: 'tree', 'aria-label': '知识图谱' }, scroll);
    const eg = svgEl('g', {}, svg);
    ids.forEach((id) => {
      const par = parentOf[id]; if (!par || !pos[par]) return;
      const a = pos[par], b = pos[id];
      const x1 = a.x + 14 + labelWidth(tree[par], a.lines) + 22, x2 = b.x - 6, mx = (x1 + x2) / 2;
      svgEl('path', { d: `M${x1} ${a.y} C${mx} ${a.y} ${mx} ${b.y} ${x2} ${b.y}`, class: 'edge' + (onPath.has(id) && onPath.has(par) ? ' path' : '') }, eg);
    });
    ids.forEach((id) => {
      const t = tree[id], p = pos[id], lw = labelWidth(t, p.lines);
      const g = svgEl('g', { class: `nd ${t.kind}${id === sel ? ' sel' : ''}`, tabindex: '0', role: 'treeitem', 'aria-label': t.name, 'aria-expanded': String(open.has(id) && t.kids.length > 0), transform: `translate(${p.x} ${p.y})` }, svg);
      const hgt = ROWH + (p.lines.length - 1) * LINEH - 6;
      svgEl('rect', { class: 'hit', x: -10, y: -hgt / 2, width: lw + 54, height: hgt }, g);
      svgEl('rect', { class: 'hl', x: 6, y: -hgt / 2 + 2, width: lw + 16, height: hgt - 4, rx: 4 }, g);
      if (t.kind === 'kp') svgEl('circle', { class: 'dot' + (t.n.src.includes('iv') ? ' iv' : ''), cx: 0, cy: 0, r: 4.5 }, g);
      const top = -((p.lines.length - 1) * LINEH) / 2;
      p.lines.forEach((ln, i) => { svgEl('text', { class: 'lb', x: 14, y: top + i * LINEH + 5 }, g).textContent = ln; });
      if (t.kids.length) {
        const cx = 14 + lw + 16;
        svgEl('circle', { class: 'tg', cx, cy: 0, r: 9 }, g);
        svgEl('text', { class: 'tg-t', x: cx, y: 4, 'text-anchor': 'middle' }, g).textContent = open.has(id) ? '−' : String(countIn(id));
      }
      g.addEventListener('click', () => clickNode(id));
      g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); clickNode(id); } });
    });
    scroll.scrollLeft = keepL; scroll.scrollTop = keepT;
    if (scrollToSel && pos[sel]) scroll.scrollTo({ left: Math.max(0, pos[sel].x - 120), top: Math.max(0, pos[sel].y - scroll.clientHeight / 2) });
  }

  function collapse(id) { open.delete(id); tree[id].kids.forEach(collapse); }
  function clickNode(id) {
    const t = tree[id];
    if (t.kids.length) {
      if (open.has(id) && sel === id) collapse(id);
      else { if (t.kind === 'mod') tree.root.kids.forEach((m) => { if (m !== id) collapse(m); }); open.add(id); }
    }
    sel = id; render(false); renderDetail(); setHash(id);
  }
  function go(id) {
    tree.root.kids.forEach(collapse);
    pathTo(id).slice(0, -1).forEach((p) => open.add(p));
    sel = id; render(true); renderDetail(); setHash(id);
  }
  function setHash(id) { try { history.replaceState(null, '', id === 'root' ? location.pathname : '#' + id); } catch (e) {} }

  // ---------- 详情 ----------
  function btn(id, cls) { const b = h('button', cls, nameOf(id)); b.type = 'button'; b.addEventListener('click', () => go(id)); return b; }
  function section(title) { const s = h('section'); s.appendChild(h('h3', '', title)); return s; }

  function step(kind, id, why, cls) {
    const st = h('div', 'step' + (cls ? ' ' + cls : ''));
    const rail = h('div', 'rail'); rail.appendChild(h('span'));
    const body = h('div', 'body');
    const line = h('div'); line.appendChild(h('span', 'kind', kind));
    line.appendChild(id === sel ? h('span', 'nm', nameOf(id)) : btn(id, 'nm'));
    body.appendChild(line);
    if (why) body.appendChild(h('div', 'why', why));
    st.append(rail, body); return st;
  }

  function chainFor(id) {
    const seq = []; let c = id; while (c) { seq.unshift(c); c = primaryOf[c]; }
    const n = byId[id], chain = h('div', 'chain');
    chain.appendChild(step('模块', n.m, ''));
    let lastG = null;
    seq.forEach((k, i) => {
      const kn = byId[k];
      if (kn.g && kn.g !== lastG) { chain.appendChild(step('分组', kn.g, grps[kn.g].desc)); lastG = kn.g; }
      const prev = seq[i - 1];
      const why = prev ? (kn.why && kn.why[prev]) || '' : '这条主线的起点';
      chain.appendChild(step(k === id ? '当前' : '先学', k, why, k === id ? 'cur' : ''));
    });
    G.nodes.filter((d) => primaryOf[d.id] === id).forEach((d) => chain.appendChild(step('接着学', d.id, (d.why && d.why[id]) || '', 'next')));
    return chain;
  }

  // 跨链路关系：按对方模块分组，写模块级关系说明和每一对知识点的关系
  function relationsFor(ids, includeSameModule) {
    const set = new Set(ids), buckets = {};
    const add = (otherMod, item) => { (buckets[otherMod] = buckets[otherMod] || { dirs: new Set(), items: [] }).items.push(item); buckets[otherMod].dirs.add(item.dir); };
    ids.forEach((id) => {
      const n = byId[id];
      n.pre.forEach(([p, s]) => {
        if (set.has(p) || p === primaryOf[id]) return;
        const pm = byId[p].m; if (pm === n.m && !includeSameModule) return;
        add(pm === n.m ? '_same' : pm, { dir: 'dep', from: id, to: p, why: (n.why && n.why[p]) || '', strength: s });
      });
      dependents(id).forEach((d) => {
        if (set.has(d.id) || primaryOf[d.id] === id) return;
        if (d.m === n.m && !includeSameModule) return;
        add(d.m === n.m ? '_same' : d.m, { dir: 'use', from: d.id, to: id, why: (d.why && d.why[id]) || '' });
      });
    });
    const keys = Object.keys(buckets).sort((a, b) => (a === '_same' ? -1 : b === '_same' ? 1 : 0));
    if (!keys.length) return null;
    const wrapEl = h('div', 'rels');
    const self = byId[ids[0]].m;
    keys.forEach((k) => {
      const b = buckets[k], box = h('div', 'rel');
      const dir = b.dirs.size === 2 ? '相互关联' : b.dirs.has('dep') ? '依赖它' : '用到这里';
      const head = h('div', 'rh'); head.append(h('span', '', k === '_same' ? '本模块的其他链路' : mods[k].name), h('span', 'dir', dir));
      box.appendChild(head);
      if (k !== '_same') { const t = linkText(self, k); if (t) box.appendChild(h('div', 'rd', t)); }
      b.items.forEach((it) => {
        const pair = h('div', 'pair');
        const other = it.dir === 'dep' ? it.to : it.from, mine = it.dir === 'dep' ? it.from : it.to;
        const label = it.dir === 'dep' ? `${nameOf(mine)} 需要先会` : `${nameOf(mine)} 被用于`;
        pair.appendChild(h('div', 'loc', label + (it.strength === 's' ? '（有帮助）' : '')));
        pair.appendChild(btn(other));
        pair.appendChild(h('div', 'loc', loc(other)));
        if (it.why) pair.appendChild(h('div', 'why', it.why));
        box.appendChild(pair);
      });
      wrapEl.appendChild(box);
    });
    return wrapEl;
  }

  function renderRelations() {
    const t = tree[sel], body = $('relBody'); body.textContent = '';
    let title, rel = null;
    if (t.kind === 'root') {
      title = '模块之间的关系';
      const wrapEl = h('div', 'rels');
      G.modules.forEach((m) => Object.entries(m.links || {}).forEach(([o, txt]) => {
        const box = h('div', 'rel'); const head = h('div', 'rh');
        head.append(h('span', '', `${m.name} · ${mods[o].name}`)); box.append(head, h('div', 'rd', txt));
        const pair = h('div', 'pair'); pair.append(btn(m.id), btn(o)); box.appendChild(pair); wrapEl.appendChild(box);
      }));
      rel = wrapEl.childNodes.length ? wrapEl : null;
    } else if (t.kind === 'mod') {
      title = `${t.name}和其他模块的关系`;
      rel = relationsFor(G.nodes.filter((n) => n.m === sel).map((n) => n.id), false);
    } else if (t.kind === 'grp') {
      title = `${t.name}和其他链路的关系`;
      rel = relationsFor(G.nodes.filter((n) => n.g === sel).map((n) => n.id), true);
    } else {
      title = `${t.name}和其他链路的关系`;
      rel = relationsFor([sel], true);
    }
    $('relTitle').textContent = title;
    body.appendChild(rel || h('p', 'note', '这里没有和其他链路的关联，它只在本条主线上。'));
  }

  function renderDetail() {
    renderRelations();
    const box = $('detail'); box.textContent = '';
    const t = tree[sel];
    if (t.kind === 'root') return renderOverview(box);
    if (t.kind === 'mod') return renderModule(box, sel);
    if (t.kind === 'grp') return renderGroup(box, sel);
    const n = t.n;
    const meta = h('div', 'meta'); meta.appendChild(h('span', '', loc(sel)));
    n.src.forEach((s) => meta.appendChild(h('span', 'chip' + (s === 'iv' ? ' iv' : ''), SRC[s])));
    box.append(meta, h('h2', '', n.name), h('p', '', n.desc));
    if (n.role) box.appendChild(h('p', 'role', n.role));

    const s1 = section('所在链路'); s1.appendChild(chainFor(sel)); box.appendChild(s1);


    const s3 = section('技术深度');
    if (n.depth) {
      const d = h('div', 'depth');
      n.depth.forEach((txt, i) => {
        const row = h('div', 'lv'); const b = h('b', '', LV[i]);
        const bar = h('span', 'bar'); for (let k = 0; k < 3; k++) bar.appendChild(h('i', k <= i ? 'on' : ''));
        b.appendChild(bar); row.append(b, h('span', '', txt)); d.appendChild(row);
      });
      s3.appendChild(d);
    } else s3.appendChild(h('div', 'todo', '这个知识点的深度说明还在整理中。'));
    box.appendChild(s3);

    const s4 = section('面试里要能讲到');
    const ol = h('ol'); n.points.forEach((x) => ol.appendChild(h('li', '', x))); s4.appendChild(ol); box.appendChild(s4);
  }

  function renderModule(box, mid) {
    const m = mods[mid], nodes = G.nodes.filter((n) => n.m === mid);
    const iv = nodes.filter((n) => n.src.includes('iv')).length;
    box.append(h('div', 'meta', '模块'), h('h2', '', m.name), h('p', '', `共 ${nodes.length} 个知识点，其中 ${iv} 个在真实面试中被问到。`));
    if (m.groups) {
      const s = section('包含的分组'); const list = h('div', 'others');
      m.groups.forEach((gr) => { const o = h('div', 'other'); const b = h('button'); b.type = 'button'; b.append(h('span', 'n', gr.name), h('span', 't', `${countIn(gr.id)} 个知识点`)); b.addEventListener('click', () => clickNode(gr.id)); o.append(b, h('div', 'why', gr.desc)); list.appendChild(o); });
      s.appendChild(list); box.appendChild(s);
    }
  }

  function renderGroup(box, gid) {
    const gr = grps[gid], nodes = G.nodes.filter((n) => n.g === gid);
    box.append(h('div', 'meta', mods[gr.m].name + ' · 分组'), h('h2', '', gr.name), h('p', '', gr.desc));
    const s = section('包含的知识点'); const list = h('div', 'list');
    nodes.forEach((n) => { const b = h('button'); b.type = 'button'; b.append(h('span', '', n.name), h('span', 't', n.src.includes('iv') ? '面试问到' : '')); b.addEventListener('click', () => go(n.id)); list.appendChild(b); });
    s.appendChild(list); box.appendChild(s);
  }

  function renderOverview(box) {
    box.append(h('div', 'meta', '总览'), h('h2', '', '从哪里开始'), h('p', '', `${G.modules.length} 个模块、${G.nodes.length} 个知识点。每个模块分成几组，组内按“先学什么、后学什么”串成主线。点左边的模块逐层展开，点知识点看它的说明、完整链路、和其他链路的关系，以及要掌握到什么深度。`));
    const s = section('面试里问得最多的模块'); const list = h('div', 'list');
    G.modules.map((m) => [m, G.nodes.filter((n) => n.m === m.id && n.src.includes('iv')).length]).filter(([, c]) => c).sort((a, b) => b[1] - a[1])
      .forEach(([m, c]) => { const b = h('button'); b.type = 'button'; b.append(h('span', '', m.name), h('span', 't', `${c} 个知识点被问到`)); b.addEventListener('click', () => clickNode(m.id)); list.appendChild(b); });
    s.appendChild(list); box.appendChild(s);
    const s2 = section('示例'); s2.appendChild(h('p', 'role', '所有知识点的说明、链路关系、技术深度和模块之间的关系都已补全。可以从下面几个面试高频的知识点开始看。'));
    const l2 = h('div', 'list'); ['ev-sample', 'sql-semantic', 'eval'].forEach((id) => { const b = h('button'); b.type = 'button'; b.append(h('span', '', nameOf(id)), h('span', 't', byId[id] ? loc(id) : '模块')); b.addEventListener('click', () => go(id)); l2.appendChild(b); });
    s2.appendChild(l2); box.appendChild(s2);
  }

  function search() {
    const q = $('q').value.trim().toLowerCase(), box = $('results'); box.textContent = '';
    if (!q) { box.hidden = true; return; }
    box.hidden = false;
    const hits = G.nodes.filter((n) => (n.name + n.desc + n.points.join('')).toLowerCase().includes(q)).slice(0, 12);
    if (!hits.length) { box.appendChild(h('div', 'empty', '没有找到相关知识点')); return; }
    hits.forEach((n) => { const b = h('button'); b.type = 'button'; b.append(h('span', '', n.name), h('span', 'm', loc(n.id))); b.addEventListener('click', () => { box.hidden = true; $('q').value = ''; go(n.id); }); box.appendChild(b); });
  }

  $('q').addEventListener('input', search);
  $('collapse').addEventListener('click', () => { tree.root.kids.forEach(collapse); open.add('root'); sel = 'root'; render(false); renderDetail(); $('scroll').scrollTo({ left: 0, top: 0 }); setHash('root'); });

  fetch('data/graph.json').then((r) => (r.ok ? r : fetch('graph.json'))).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((g) => {
      build(g);
      const iv = g.nodes.filter((n) => n.src.includes('iv')).length;
      const edges = g.nodes.reduce((a, n) => a + n.pre.length, 0);
      $('stats').textContent = `${g.nodes.length} 个知识点 · ${g.modules.length} 个模块 · ${edges} 条先修关系 · ${iv} 个在真实面试中被问到`;
      const hash = (location.hash || '').slice(1);
      if (tree[hash] && hash !== 'root') go(hash); else { render(false); renderDetail(); }
    })
    .catch(() => { $('status').textContent = '图谱数据没有载入成功，请刷新页面再试。'; $('stats').textContent = ''; });
})();
</script>
